name: Privacidad y tests

# Se ejecuta en cada push y en cada PR. Falla si hay datos personales
# o si los tests no pasan.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    name: Privacidad y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de test
        run: python -m pip install pytest

      - name: Comprobar privacidad
        # El checkout solo tiene lo que hay en git, que es justo lo que
        # queremos revisar. Los datos locales no estan y no deben estar.
        run: python scripts/check-privacidad.py --todo

      - name: Tests
        run: python -m pytest 4-ofertas/tests/ -v

      - name: Compilar todos los scripts
        run: |
          python -m compileall -q 4-ofertas/scripts scripts
