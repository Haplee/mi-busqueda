name: Bug

title: "[Bug] "

labels: ["bug", "ayuda necesaria"]

body:
  - type: markdown
    attributes:
      value: |
        Gracias. Cuanto mas concreto sea el ejemplo, antes lo miro.

  - type: textarea
    id: que-pasa
    attributes:
      label: Que pasa
      description: Que esperabas y que ha pasado.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Como reproducirlo
      description: Pasos numerados, empezando por el comando exacto.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Resultado de `python --version` y `git rev-parse --short HEAD`.
      placeholder: "Python 3.12.4, commit a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: salida
    attributes:
      label: Salida del error
      render: shell
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - WSL
        - macOS
        - Otro
    validations:
      required: true

  - type: checkboxes
    id: datos
    attributes:
      label: Privacidad
      options:
        - label: He revisado la salida y no contiene datos personales mios
          required: true
